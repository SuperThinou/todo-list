<!doctype html><html lang="en" data-theme="light"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Todo List</title><script defer="defer" src="main.js"></script></head><body><div id="page"><header><h1>my Todo List</h1><button id="darkModeBtn" class="theme-toggle"><div class="sun">☀️</div><div class="moon">🌙</div></button></header><div class="content-container"><div id="sidebar"><h2>Tasks</h2><div class="tasks-btn-container"><button id="allTasksBtn" class="nav-el" data-view="all">All tasks</button> <button id="todayBtn" class="nav-el" data-view="today">Today</button> <button id="thisWeekBtn" class="nav-el" data-view="week">This Week</button></div><div class="project-btn-container"><div id="projectsAndBtn"><h2>Projects</h2><button id="newProjectBtn">+</button></div></div><div id="newProjectForm" class="hidden"><input id="projectName" placeholder="Project name"/><div class="btn-container"><button id="addProjectBtn">Add</button> <button id="cancelProjectBtn">Cancel</button></div></div><div id="allProjectsContainer"></div></div><main><h2 id="mainTitle">All Tasks</h2><button id="newTaskBtn" class="blue-btn">New Task</button><div id="allTodosContainer"></div></main></div><footer><p>NBX 2026 ©</p><a href="https://github.com/SuperThinou" target="_blank" class="github-link"></a></footer></div><div class="overlay hidden" id="TaskPopup"><form id="TaskForm" action=""><h2 id="addNewTaskTitle">Add new task</h2><input id="title" name="title" placeholder="Title" aria-label="task title" required maxlength="100"/> <textarea id="description" name="description" placeholder="Description (optional)" aria-label="task description" maxlength="400"></textarea> <input type="date" id="dueDate" name="dueDate" required/><fieldset><legend>Priority</legend><input type="radio" id="low" value="Low" name="priority" required/> <label for="low">Low</label> <input type="radio" id="medium" value="Medium" name="priority" required/> <label for=" medium">Medium</label> <input type="radio" id="high" value="High" name="priority" required/> <label for=" high">High</label></fieldset><button id="addBtn" name="addBtn" type="button">Add</button></form></div></body></html>
